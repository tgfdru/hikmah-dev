# Mu'een API on Dokploy (Compose service).
#
# Dokploy: Create Service -> Compose -> Provider: GitHub (tgfdru/hikmah-dev, branch nader/agent)
#   Compose path: ./deploy/docker-compose.dokploy.yml
#   Environment:  paste the variables listed below (secrets stay in Dokploy, never in git)
#   Domains:      service "api", port 8000, HTTPS on (Traefik / Let's Encrypt)
#
# On every deploy `kb-build` runs once (downloads are cached in the volume; ~1-3 min with the
# committed embedding cache), then `api` starts. No host ports are published: Dokploy's
# Traefik routes the domain to api:8000.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage

  kb-build:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    environment:
      QDRANT_URL: http://qdrant:6333
      DEVICE: cpu
      SHAMELA: ${SHAMELA:-1}   # selected Shamela books (first build ~25 min, then cached)
    volumes:
      - mueen_kb:/var/lib/mueen
    depends_on:
      - qdrant

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      WORK_DIR: /var/lib/mueen
      HF_HOME: /var/lib/mueen/models/hf
      RETRIEVER: hybrid
      # LLM (main): Gemini via AI Studio
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash-lite}
      AI_MODEL_ANALYZE: ${AI_MODEL_ANALYZE:-gemini-3.1-flash-lite}
      AI_MODEL_ROUTE: ${AI_MODEL_ROUTE:-gemini-3.1-flash-lite}
      AI_MODEL_GENERATE: ${AI_MODEL_GENERATE:-gemini-3.8-flash}
      AI_MODEL_FALLBACK: ${AI_MODEL_FALLBACK:-gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite}
      # Independent judge (second verification layer)
      VERIFY_LLM_JUDGE: ${VERIFY_LLM_JUDGE:-1}
      AI_JUDGE_BASE_URL: ${AI_JUDGE_BASE_URL:-https://opencode.ai/zen/v1}
      AI_JUDGE_API_KEY: ${AI_JUDGE_API_KEY}
      AI_MODEL_JUDGE: ${AI_MODEL_JUDGE:-gpt-5.4-nano}
      # Owner's control
      MUEEN_API_KEYS: ${MUEEN_API_KEYS}
      MUEEN_SERVICE_UNTIL: ${MUEEN_SERVICE_UNTIL:-}
    volumes:
      - mueen_kb:/var/lib/mueen
    depends_on:
      qdrant:
        condition: service_started
      kb-build:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3

volumes:
  qdrant_storage:
  mueen_kb:
