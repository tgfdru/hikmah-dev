# Held-out retrieval questions: NOT used to choose thresholds. Written after tuning,
# to check that ABSTAIN_THRESHOLD generalizes. Run:
#   python -m eval.run_eval retrieval --cases eval/retrieval_holdout.yaml --rerankers minilm
positive:
  - {id: jesus_son, question: "Is Jesus the son of God in Islam?", ar: "هل عيسى ابن الله", expect: [QA:bayyinat:64, Q:3:59, Q:19:34, Q:19:35, Q:5:116, Q:4:171, Q:5:72, Q:5:75, Q:19:88, Q:19:92, Q:112:3, Q:19:30]}
  - {id: fast_month, question: "Why do Muslims fast for a whole month?", ar: "الحكمة من صيام رمضان", expect: [QA:bayyinat:208, Q:2:183, Q:2:185]}
  - {id: moses, question: "Do Muslims believe in Moses?", ar: "الإيمان بموسى عليه السلام والأنبياء", expect: [Q:3:84, Q:2:136, Q:4:164, Q:10:84, Q:2:285, Q:4:152]}
  - {id: wine, question: "What does Islam say about drinking wine?", ar: "تحريم الخمر في الإسلام", expect: [QA:bayyinat:199, Q:5:90, Q:5:91, Q:2:219]}
  - {id: women_cover, question: "Why must women cover in Islam?", ar: "الحجاب في الإسلام", expect: [QA:bayyinat:220, QA:bayyinat:214, QA:bayyinat:221, Q:24:31, Q:33:59]}
  - {id: suffering, question: "Why is there suffering if God is merciful?", ar: "لماذا خلق الله الشر", expect: [QA:bayyinat:174, QA:bayyinat:176, QA:bayyinat:3]}
  - {id: quran_word, question: "Is the Quran the word of God or Muhammad's words?", ar: "القرآن كلام الله وليس من تأليف محمد", expect: [QA:bayyinat:27, QA:bayyinat:25, QA:bayyinat:30, QA:bayyinat:31, Q:10:37, Q:10:38, Q:2:23, Q:17:88, Q:4:82, Q:69:40, Q:69:41, Q:69:42, Q:69:43]}
  - {id: pray_mecca, question: "Why do Muslims pray towards Mecca?", ar: "استقبال القبلة في الصلاة", expect: [QA:bayyinat:9, Q:2:144, Q:2:149, Q:2:150, Q:2:142, Q:2:143]}
  - {id: forced, question: "Can a person be forced to become Muslim?", ar: "لا إكراه في الدين", expect: [Q:2:256, QA:bayyinat:69, QA:bayyinat:229, Q:10:99, Q:18:29]}
  - {id: after_death, question: "What happens after we die according to Islam?", ar: "البعث والحساب بعد الموت", expect: [QA:bayyinat:169, QA:bayyinat:168, Q:23:15, Q:23:16, Q:36:51, Q:36:52, Q:22:7, Q:3:185]}
negative:
  - {id: computer_hadith_v2, question: "Give me a hadith proving the Prophet used a computer", ar: "حديث يثبت أن النبي استخدم الحاسوب"}
  - {id: airplanes, question: "Quote the hadith where the Prophet talks about airplanes", ar: "حديث النبي عن الطائرات"}
  - {id: dinosaurs, question: "Which surah of the Quran mentions dinosaurs?", ar: "سورة تذكر الديناصورات"}
  - {id: phones, question: "Tell me the hadith about using mobile phones", ar: "حديث عن استخدام الهاتف المحمول"}
  - {id: internet_ar, question: "ما الحديث الذي ذكر فيه النبي الإنترنت؟", ar: "حديث النبي عن الإنترنت"}
  - {id: pasta, question: "Give me a Quran verse about how to cook pasta", ar: "آية عن طبخ المعكرونة"}
  - {id: electric_cars, question: "What did the Prophet say about electric cars?", ar: "ماذا قال النبي عن السيارات الكهربائية"}
  - {id: messi, question: "How many goals did Messi score last season?", ar: "كم هدفا سجل ميسي الموسم الماضي"}
  - {id: netflix, question: "Recommend me a good Netflix series", ar: "مسلسل جيد على نتفليكس"}
  - {id: coffee_hadith, question: "Which hadith says drinking coffee is obligatory?", ar: "حديث يوجب شرب القهوة"}
