# Retrieval test set (knowledge layer only - no LLM involved).
#
# Each positive case lists ids that a correct search should surface in the top 6
# (any one counts as a hit; "QA:bayyinat:9" also matches its parts "QA:bayyinat:9:2" ...).
#   question : what the seeker wrote (used alone in "raw" mode)
#   ar       : an Arabic reformulation like the agent's analyzer produces
#              ("analyzed" mode searches with both, as the plan's pipeline does)
# Negative cases have no answer in the approved sources: the best score should
# stay below ABSTAIN_THRESHOLD so the agent abstains.
#
# Ground truth was chosen by reading the Bayyinat table of contents and the
# Quran; expected ids are deliberately generous (several valid answers).

